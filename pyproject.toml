[project]
name = "littleman"
version = "0.1.0"
description = "ICFPC 2026 littleman simulator and tooling"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littleman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
