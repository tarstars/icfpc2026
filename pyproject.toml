[project]
name = "littleman"
version = "0.1.0"
description = "ICFPC 2026 littleman simulator and tooling"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "typing-extensions>=4.4,<5",
]

[project.scripts]
icfpc-api = "icfpc_api.cli:main"

[dependency-groups]
dev = [
    "ortools>=9.15.6755",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icfpc_api", "src/littleman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: the suite is CPU-bound tick simulation with no shared
# state, and this took it from 476s to 107s on 20 cores. Use `-p no:xdist`
# or `-n 0` when a failure's ordering or output needs to be read serially.
addopts = "-n auto"
