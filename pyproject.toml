[project]
name = "littleman"
version = "0.1.0"
description = "ICFPC 2026 littleman simulator and tooling"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "typing-extensions>=4.4,<5",
]

[project.scripts]
icfpc-api = "icfpc_api.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "pytest-xdist>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icfpc_api", "src/littleman"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "littleman._fastsim_rust"
