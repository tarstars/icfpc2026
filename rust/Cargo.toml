[package]
name = "littleman-fastsim-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "_fastsim_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]
cli = ["dep:rayon", "dep:rayon-core"]

[dependencies]
bincode = "1.3.3"
jobserver = "=0.1.31"
pyo3 = { version = "0.21.2", features = ["extension-module"], optional = true }
rayon = { version = "=1.10.0", optional = true }
rayon-core = { version = "=1.12.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[[bin]]
name = "littleman-rust"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[package.metadata.maturin]
name = "littleman._fastsim_rust"
