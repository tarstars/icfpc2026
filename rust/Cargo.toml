[package]
name = "littleman-fastsim-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "_fastsim_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[package.metadata.maturin]
name = "littleman._fastsim_rust"
